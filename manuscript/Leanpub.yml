title: From Molecules to Quantum Circuits
subtitle: A Computational Guide to Fermion-to-Qubit Encodings
authors: John S Azariah
language: en
has_sample: true
cover_image: cover.png
about: |
  **From Molecules to Quantum Circuits** is a computational
  guide to the translation layer from molecular electronic structure
  to logical quantum circuits.

  Core transformations have executable FockMap companions; independent PySCF
  scripts generate the chemistry references used to check them.

  The guide covers six fermion-to-qubit encodings (Jordan-Wigner,
  Bravyi-Kitaev, Parity, balanced binary tree, balanced ternary tree,
  Vlasov tree),
  qubit tapering via diagonal and Clifford Z₂ symmetries, Trotter
  decomposition with CNOT cost analysis, and circuit output in OpenQASM
  and Q#.

  Two running examples keep construction and reference chemistry distinct:
  H₂ is derived from generated integrals to a verified JW matrix and circuit;
  H₂O provides a PySCF FCI angular scan at fixed experimental O-H length.

  Intended for graduate students, advanced undergraduates, and researchers
  who know some quantum mechanics and linear algebra but have not
  previously worked with fermion-to-qubit encodings.

  The 23 chapters are supported by a practical code-reading bridge,
  selected API and mathematical references, and selected worked solutions.
  No previous chemistry, F# or measurement-statistics background is assumed.

  Companion software: https://github.com/johnazariah/encodings
  Book web version: https://johnazariah.github.io/molecules-to-circuits/

