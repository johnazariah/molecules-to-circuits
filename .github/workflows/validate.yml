name: Validate book evidence

on:
  workflow_call:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements-data.txt
      - name: Check manuscript structure and manifests
        run: |
          make manifest-check
          python scripts/check-book-contract.py
          python -m unittest discover -s tests -p test_book_contract.py
      - name: Execute printed complete examples and numbered labs
        run: make support-check lab-check
      - name: Check the read-only oracle and spectrum negative controls
        run: |
          python code/ch09-verify-h2.py
          python scripts/check-oracle-integrity.py
          dotnet fsi scripts/check-spectral-certification.fsx
      - name: Check pipeline output isolation
        run: make pipeline-check
