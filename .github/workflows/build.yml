name: Build Manuscript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rendering
      - name: Check publication failure controls
        run: make tooling-check
      - name: Build print formats from one inventory
        run: make all sample epub
      - name: Source word count
        run: make word-count
      - name: Package companion source and evidence commands
        run: |
          tar czf labs.tar.gz labs/ code/ scripts/ tests/ \
            README.md Makefile requirements-data.txt LICENSE-CODE MANUSCRIPT-RIGHTS
      - uses: actions/upload-artifact@v4
        with:
          name: book-and-companions
          if-no-files-found: error
          path: |
            manuscript/molecules-to-circuits.pdf
            manuscript/molecules-to-circuits-sample.pdf
            manuscript/molecules-to-circuits.epub
            labs.tar.gz
