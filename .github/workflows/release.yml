name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rendering

      - name: Check publication failure controls
        run: make tooling-check

      - name: Build all print formats from the accepted source
        run: make all sample epub

      - name: Package labs
        run: |
          tar czf labs-${{ github.ref_name }}.tar.gz \
            labs/ code/ scripts/ tests/ README.md Makefile requirements-data.txt \
            LICENSE-CODE MANUSCRIPT-RIGHTS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manuscript/molecules-to-circuits.pdf
            manuscript/molecules-to-circuits-sample.pdf
            manuscript/molecules-to-circuits.epub
            labs-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
