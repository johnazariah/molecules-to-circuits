      - paragraph [ref=e79]:
        - text: We assume familiarity with linear algebra (vectors, matrices, eigenvalues) and introductory quantum mechanics (wavefunctions, bra-ket notation, the hydrogen atom). We do
        - emphasis [ref=e80]: not
        - text: "assume prior knowledge of:"
