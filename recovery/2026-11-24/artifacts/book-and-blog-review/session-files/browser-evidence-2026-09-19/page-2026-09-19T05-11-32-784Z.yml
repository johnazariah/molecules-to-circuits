      - paragraph [ref=e120]: "You can read straight through (recommended for first reading), or jump to a specific stage if you already know the earlier material. Each chapter begins with “In This Chapter” learning objectives and ends with a summary and exercises. The appendices are retrieval aids: Appendix A collects selected API contracts and complete small programs; Appendix B collects notation and conventions. Neither is a store of prerequisites that you were expected to read before Chapter 1."
      - paragraph [ref=e121]: For a first reading, work through the derivations and trace the small examples before running the longer companions. For a practical reading, keep the repository beside the book and compare the named intermediate results, not just the last printed energy. A successful execution tells you that a program ran; the physical sector, matrix ordering and energy convention tell you what its result means.
      - paragraph [ref=e122]:
        - text: Exercises range from a hand calculation to a bounded programming task. Try the calculation first, then use the companion to inspect the result.
        - strong [ref=e123]: Selected Worked Solutions
        - text: gives reasoning for selected questions, identified by chapter title and exercise name rather than just a number. It is not a complete instructor answer key. An open-ended investigation does not acquire a unique answer merely because it appears at the end of a chapter.
