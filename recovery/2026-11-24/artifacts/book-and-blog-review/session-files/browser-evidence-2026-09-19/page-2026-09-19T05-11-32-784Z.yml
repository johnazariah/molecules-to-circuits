        - link "Link to this Section":
          - /url: "#preface"
          - text: ¶
      - paragraph [ref=e56]: Every chemistry textbook tells you that water’s bond angle is 104.5° and waves at VSEPR theory. Every quantum computing textbook tells you that fermions need to be encoded as qubits and shows you the Jordan-Wigner transform. Very few resources connect these two worlds with enough detail to show what has to happen between a chemistry calculation and a circuit, or which part of that work an encoding library actually does.
      - paragraph [ref=e57]: This book follows that translation layer. It does not turn circuit construction into an energy measurement by giving it a more ambitious name.
      - paragraph [ref=e58]: "We walk through the translation from molecular data to logical quantum circuits with two running examples: the hydrogen molecule (H₂), because it is the simplest system that exhibits all the essential structure, and the water molecule (H₂O), because it gives us a useful, larger chemistry reference against which to ask what remains."
      - paragraph [ref=e59]: For H₂ in the STO-3G basis at a bond length of 0.74 Å, generated integrals lead to a checked Jordan-Wigner Hamiltonian, comparisons between encodings, and logical product-formula circuits. Nuclear repulsion is a separate energy contribution. State preparation and energy estimation are separate algorithmic tasks, not hidden services supplied by the Hamiltonian builder.
      - paragraph [ref=e60]:
        - text: For water, the supplied calculation is a
        - strong [ref=e61]: classical PySCF FCI angular scan at fixed experimental O–H length, 0.9584 Å
        - text: ". Its sampled minimum is conditional on that length, basis and grid. It is neither a full geometry optimisation nor a water energy calculated by running a FockMap circuit. The distinction matters: a reference calculation can teach us what a quantum pipeline would have to reproduce without pretending that the pipeline has already done it."
      - paragraph [ref=e62]: Core transformations have executable FockMap companions, while PySCF scripts produce the independent chemistry references. The companions expose signs, coefficients, and intermediate Pauli strings and fail closed when a live package does not reproduce the canonical matrix. Exercises remain at the end of each chapter for readers who want to deepen their understanding.
      - paragraph [ref=e63]: "The book follows a deliberate pedagogical ordering: chemistry and physics first, mathematical formalism second, executable code third. We believe the question “why does this matter?” should always be answered before the question “how does this work?” — and both should be answered before “how do I compute it?”"
      - heading "Who This Book Is For Link to this Section" [level=3] [ref=e64]:
        - text: Who This Book Is For
