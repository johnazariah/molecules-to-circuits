      - paragraph [ref=e145]:
        - text: The library is open-source (MIT license) and runs on Windows, macOS, and Linux via .NET 10. The book repository, including the Python chemistry references and F# entry points, is at
        - link "https://github.com/johnazariah/molecules-to-circuits" [ref=e146] [cursor=pointer]:
          - /url: https://github.com/johnazariah/molecules-to-circuits
        - text: . Python/PySCF dependencies are listed separately in
        - code [ref=e150]: requirements-data.txt
        - text: ; installing FockMap does not install them.
      - paragraph [ref=e151]:
        - text: Run scripts from the repository root, for example
        - code [ref=e152]: dotnet fsi labs/01-first-encoding.fsx
        - text: . The code-reading bridge explains package restoration, paths and the distinction between a complete script, a contextual excerpt and pseudocode. Numerical agreement within a stated tolerance is the portable target; reproducing archived bytes additionally requires the recorded numerical environment.
