        - listitem [ref=e90]:
          - paragraph [ref=e91]: F# or functional programming
        - listitem [ref=e92]:
          - paragraph [ref=e93]: Measurement statistics
      - paragraph [ref=e94]:
        - text: The chapters introduce these as they become useful. Read the unnumbered
        - strong [ref=e95]: Reading and Running the Code
        - text: bridge between Chapters 1 and 2 before the first coefficient factory. Later chapters explain the particular tree, record, circuit and statistical constructions they need; the bridge is not a requirement to learn a programming language in advance.
