          - text: ¶
      - paragraph [ref=e155]: John S Azariah is a software engineer, language designer, and quantum computing researcher whose work sits at the intersection of chemistry, computation, and executable mathematics. He earned a BA in Computer Science and Chemistry from Dartmouth College, a combination that now finds a natural expression in quantum simulation.
      - paragraph [ref=e156]: Over more than three decades in professional software development, he has worked through successive technology shifts including desktop software, the internet, cloud computing, quantum programming, and AI. His career has included roles on Microsoft Excel and Microsoft Project, early SharePoint prototypes, Visual J#.NET, large-scale Azure systems, and principal engineering work across Azure Batch, Azure Kubernetes Service, and AI systems in APAC. He was also compiler lead and one of the language designers behind Microsoft Q#.
      - paragraph [ref=e157]: Alongside industry work, he has maintained a longstanding interest in functional programming, scientific computing, and software craft. He is currently a Principal AI SME at Microsoft and is pursuing a PhD in Quantum Computing at the University of Technology Sydney under Dr. Chris Ferrie.
