      - paragraph [ref=f1e78]:
        - text: We assume familiarity with linear algebra (vectors, matrices, eigenvalues) and introductory quantum mechanics (wavefunctions, bra-ket notation, the hydrogen atom). We do
        - emphasis [ref=f1e79]: not
        - text: "assume prior knowledge of:"
      - list [ref=f1e80]:
        - listitem [ref=f1e81]:
          - paragraph [ref=f1e82]: Second quantization or Fock space
        - listitem [ref=f1e83]:
          - paragraph [ref=f1e84]: Pauli algebra or qubit representations
        - listitem [ref=f1e85]:
          - paragraph [ref=f1e86]: Fermion-to-qubit encodings
        - listitem [ref=f1e87]:
          - paragraph [ref=f1e88]: F# or functional programming
      - paragraph [ref=f1e89]: All of these are developed from scratch within the book.
      - heading "How to Read This Book Link to this Section" [level=3] [ref=f1e90]:
        - text: How to Read This Book
        - link "Link to this Section":
