            - text: (Chapters 14–17) — Trotterization and cost analysis
        - listitem [ref=f1e108]:
          - paragraph [ref=f1e109]:
            - strong [ref=f1e110]: The Pipeline
            - text: (Chapters 18–21) — integration, fixed-bond scan, algorithms, export
        - listitem [ref=f1e111]:
          - paragraph [ref=f1e112]:
