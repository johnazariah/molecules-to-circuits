      - paragraph [ref=f1e56]:
        - text: Every chemistry textbook tells you that water’s bond angle is 104.5° and waves at VSEPR theory. Every quantum computing textbook tells you that fermions need to be encoded as qubits and shows you the Jordan-Wigner transform. Very few resources connect these two worlds with enough detail that you could actually
        - emphasis [ref=f1e57]: compute
        - text: the bond angle from the quantum simulation, or understand
        - emphasis [ref=f1e58]: why
        - text: the encoding choice matters for the circuit you’ll run on a quantum computer.
      - paragraph [ref=f1e59]: This book fills that gap.
      - paragraph [ref=f1e60]: "We walk through the translation from molecular data to logical quantum circuits with two running examples: the hydrogen molecule (H₂), because it is the simplest system that exhibits all the essential structure, and the water molecule (H₂O), because it is the most important molecule on Earth and rich enough to make the engineering trade-offs tangible."
      - paragraph [ref=f1e61]: Core transformations have executable FockMap companions, while PySCF scripts produce the independent chemistry references. The companions expose signs, coefficients, and intermediate Pauli strings and fail closed when a live package does not reproduce the canonical matrix. Exercises remain at the end of each chapter for readers who want to deepen their understanding.
      - paragraph [ref=f1e62]: "The book follows a deliberate pedagogical ordering: chemistry and physics first, mathematical formalism second, executable code third. We believe the question “why does this matter?” should always be answered before the question “how does this work?” — and both should be answered before “how do I compute it?”"
      - heading "Who This Book Is For Link to this Section" [level=3] [ref=f1e63]:
        - text: Who This Book Is For
        - link "Link to this Section":
          - /url: "#who-this-book-is-for"
          - text: ¶
      - list [ref=f1e64]:
        - listitem [ref=f1e65]:
          - paragraph [ref=f1e66]:
            - strong [ref=f1e67]: Graduate students
            - text: starting in quantum chemistry simulation who need to understand the encoding layer between chemistry and circuits
        - listitem [ref=f1e68]:
          - paragraph [ref=f1e69]:
            - strong [ref=f1e70]: Physicists
            - text: crossing into quantum computing who know Hamiltonians but not encodings
        - listitem [ref=f1e71]:
          - paragraph [ref=f1e72]:
            - strong [ref=f1e73]: Software engineers
            - text: building quantum simulation pipelines who need the physics explained carefully
        - listitem [ref=f1e74]:
          - paragraph [ref=f1e75]:
            - strong [ref=f1e76]: Lecturers
            - text: building a course module on quantum simulation who want homework exercises with verifiable answers
      - heading "What You Need to Know Link to this Section" [level=3] [ref=f1e77]:
        - text: What You Need to Know
        - link "Link to this Section":
          - /url: "#what-you-need-to-know"
