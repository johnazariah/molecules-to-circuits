            - text: (Chapters 22–23) — scaling and what comes next
      - paragraph [ref=f1e114]: You can read straight through (recommended for first reading), or jump to a specific stage if you already know the earlier material. Each chapter begins with “In This Chapter” learning objectives and ends with “Key Takeaways” and exercises.
