          - paragraph [ref=f1e94]:
            - strong [ref=f1e95]: The Molecule
            - text: (Chapters 1–3) — from molecules to integrals
        - listitem [ref=f1e96]:
          - paragraph [ref=f1e97]:
            - strong [ref=f1e98]: The Machine
            - text: (Chapter 4) — qubits, gates, and circuits
        - listitem [ref=f1e99]:
          - paragraph [ref=f1e100]:
            - strong [ref=f1e101]: Encoding
            - text: (Chapters 5–9) — from fermions to qubits
        - listitem [ref=f1e102]:
          - paragraph [ref=f1e103]:
            - strong [ref=f1e104]: Tapering
            - text: (Chapters 10–13) — removing redundant qubits
        - listitem [ref=f1e105]:
